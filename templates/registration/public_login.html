{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto bg-[#EFEAE1] border border-[#E5E0D8] rounded-3xl p-8 shadow-sm">
    <div class="text-center space-y-2 mb-6">
        <span class="text-xs font-bold text-[#D97706] uppercase tracking-widest">Public Citizen Access</span>
        <h1 class="text-2xl font-extrabold text-slate-900">Sign In to HiWAY!</h1>
    </div>

    <form method="post" class="space-y-4">
        {% csrf_token %}
        {% if form.non_field_errors %}
        <div class="p-3 bg-rose-100 border border-rose-300 text-rose-700 text-xs rounded-xl">
            {{ form.non_field_errors.0 }}
        </div>
        {% endif %}
        <div>
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Username</label>
            <input type="text" name="username" class="w-full bg-[#FAF8F5] border border-[#E5E0D8] rounded-xl px-4 py-2.5 text-[#2D3748] outline-none" required>
        </div>
        <div>
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Password</label>
            <input type="password" name="password" class="w-full bg-[#FAF8F5] border border-[#E5E0D8] rounded-xl px-4 py-2.5 text-[#2D3748] outline-none" required>
        </div>
        <button type="submit" class="w-full bg-[#EAB308] hover:bg-[#D97706] text-slate-950 font-extrabold py-3 rounded-xl transition shadow-sm">
            Sign In
        </button>
    </form>

    <div class="mt-6 text-center text-xs text-slate-500 space-y-2 border-t border-[#E5E0D8] pt-4">
        <p>Don't have an account? <a href="{% url 'signup' %}" class="text-[#D97706] font-bold hover:underline">Register Here</a></p>
        <p><a href="{% url 'role_select' %}" class="text-slate-400 hover:underline">&larr; Change Access Role</a></p>
    </div>
</div>
{% endblock %}
